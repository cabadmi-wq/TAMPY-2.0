<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAMPY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231a56ff'/%3E%3Crect x='14' y='19' width='36' height='30' rx='10' fill='white'/%3E%3Crect x='22' y='28' width='6' height='11' rx='3' fill='%231a56ff'/%3E%3Crect x='36' y='28' width='6' height='11' rx='3' fill='%231a56ff'/%3E%3C/svg%3E">
<style>
:root {
  --accent: #1a56ff;
  --accent-hover: #0b45e6;
  --accent-soft: #eaf0ff;
  --bg: #f8f9fc;
  --surface: #ffffff;
  --text: #14171f;
  --muted: #6b7280;
  --border: #e3e6ee;
  --user-bg: #eef2ff;
  --code-bg: #0f1420;
  --shadow: 0 4px 24px rgba(20, 40, 120, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4d7cff;
    --accent-hover: #6b92ff;
    --accent-soft: #16203f;
    --bg: #0d1017;
    --surface: #161a23;
    --text: #e8ebf2;
    --muted: #8b93a5;
    --border: #262c3a;
    --user-bg: #1b2440;
    --shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(8px);
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
.marca svg { width: 30px; height: 30px; }
.btn-nuevo {
  background: transparent; color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
}
.btn-nuevo:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.col { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; }

/* Pantalla de bienvenida */
#bienvenida { text-align: center; padding: 9vh 0 3vh; }
#bienvenida svg { width: 64px; height: 64px; filter: drop-shadow(0 8px 18px rgba(26, 86, 255, .35)); }
#bienvenida h1 {
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  font-weight: 500; font-size: clamp(28px, 5vw, 38px); margin-top: 18px;
}
#bienvenida p { color: var(--muted); margin-top: 8px; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
.sugerencias button {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; cursor: pointer;
}
.sugerencias button:hover { border-color: var(--accent); color: var(--accent); }

/* Mensajes */
.msg { display: flex; gap: 14px; margin: 22px 0; animation: sube .25s ease; }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.msg.user .cuerpo {
  background: var(--user-bg); border-radius: 18px 18px 4px 18px;
  padding: 12px 16px; max-width: 85%; white-space: pre-wrap; word-break: break-word;
}
.avatar { flex: none; width: 28px; height: 28px; margin-top: 2px; }
.msg.bot .cuerpo { flex: 1; min-width: 0; line-height: 1.7; }
.cuerpo p { margin: 0 0 12px; }
.cuerpo p:last-child { margin-bottom: 0; }
.cuerpo ul, .cuerpo ol { margin: 0 0 12px 22px; }
.cuerpo li { margin: 4px 0; }
.cuerpo h1, .cuerpo h2, .cuerpo h3 { margin: 18px 0 8px; line-height: 1.3; }
.cuerpo a { color: var(--accent); }
.cuerpo code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.cuerpo pre {
  position: relative; background: var(--code-bg); color: #e6e9f2; border-radius: 12px;
  padding: 16px; overflow-x: auto; margin: 0 0 12px; font-size: 13.5px; line-height: 1.55;
}
.cuerpo pre code { background: none; padding: 0; color: inherit; }
.copiar {
  position: absolute; top: 8px; right: 8px; background: #263052; color: #cfd8ff;
  border: 0; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer;
}
.copiar:hover { background: var(--accent); color: #fff; }
.cuerpo table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; }
.cuerpo th, .cuerpo td { border: 1px solid var(--border); padding: 7px 12px; }
.cuerpo th { background: var(--accent-soft); }
.cuerpo blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.error { color: #d92d20; }

.adjuntos-msg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
.adjuntos-msg img { max-height: 140px; max-width: 220px; border-radius: 12px; object-fit: cover; }

.puntos { display: inline-flex; gap: 5px; padding: 10px 0; }
.puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: rebote 1.1s infinite; }
.puntos i:nth-child(2) { animation-delay: .15s; }
.puntos i:nth-child(3) { animation-delay: .3s; }
@keyframes rebote { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-4px); } }

/* Barra de escritura */
footer { padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.caja {
  max-width: 760px; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 10px 10px 10px 12px; transition: border-color .15s, box-shadow .15s;
}
.caja:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
.caja.arrastrando { border-color: var(--accent); background: var(--accent-soft); }
#previas { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 2px 8px; }
#previas:empty { display: none; }
.chip {
  position: relative; display: flex; align-items: center; gap: 8px; background: var(--accent-soft);
  border: 1px solid var(--border); border-radius: 12px; padding: 6px 30px 6px 10px; font-size: 13px; max-width: 240px;
}
.chip img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0;
  color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1;
}
.chip button:hover { color: #d92d20; }
.fila { display: flex; align-items: flex-end; gap: 6px; }
textarea {
  flex: 1; background: transparent; border: 0; outline: 0; resize: none; color: var(--text);
  font: inherit; font-size: 16px; line-height: 1.5; max-height: 200px; padding: 8px 4px;
}
textarea::placeholder { color: var(--muted); }
.icono {
  flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; cursor: pointer;
  display: grid; place-items: center; background: transparent; color: var(--muted);
}
.icono:hover { background: var(--accent-soft); color: var(--accent); }
.icono svg { width: 20px; height: 20px; }
#enviar { background: var(--accent); color: #fff; border-radius: 50%; }
#enviar:hover { background: var(--accent-hover); color: #fff; }
#enviar:disabled { opacity: .4; cursor: not-allowed; }
.pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<!-- Logo reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#0a3fe0"/>
    </linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="18" fill="url(#gAzul)"/>
    <line x1="32" y1="13" x2="32" y2="19" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="10.5" r="3.2" fill="#fff"/>
    <rect x="9" y="29" width="4" height="10" rx="2" fill="#fff" opacity=".75"/>
    <rect x="51" y="29" width="4" height="10" rx="2" fill="#fff" opacity=".75"/>
    <rect x="14" y="19" width="36" height="30" rx="10" fill="#fff"/>
    <rect x="22" y="28" width="6" height="11" rx="3" fill="#0a3fe0"/>
    <rect x="36" y="28" width="6" height="11" rx="3" fill="#0a3fe0"/>
    <path d="M26 43.5 Q32 47 38 43.5" stroke="#0a3fe0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<header>
  <div class="marca"><svg><use href="#logo"/></svg> TAMPY</div>
  <button class="btn-nuevo" onclick="nuevaConversacion()">+ Nueva conversación</button>
</header>

<main id="scroll">
  <div class="col" id="chat">
    <div id="bienvenida">
      <svg><use href="#logo"/></svg>
      <h1>¿En qué te ayudo hoy?</h1>
      <p>Escribe, sube una imagen o adjunta un documento.</p>
      <div class="sugerencias">
        <button onclick="sugerir('Resume este documento en puntos clave')">Resumir un documento</button>
        <button onclick="sugerir('Explícame qué hay en esta imagen')">Analizar una imagen</button>
        <button onclick="sugerir('Ayúdame a redactar un correo profesional')">Redactar un correo</button>
        <button onclick="sugerir('Revisa mi código y dime qué errores tiene')">Revisar código</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="caja" id="caja">
    <div id="previas"></div>
    <div class="fila">
      <button class="icono" title="Adjuntar archivos o imágenes" onclick="document.getElementById('archivo').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
      </button>
      <input type="file" id="archivo" multiple hidden
        accept="image/*,.pdf,.docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md,.json,.xml,.html,.css,.js,.ts,.py,.java,.c,.cpp,.cs,.php,.sql,.yaml,.yml,.log">
      <textarea id="texto" rows="1" placeholder="Escribe tu mensaje a TAMPY..."></textarea>
      <button class="icono" id="enviar" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="pie">TAMPY puede cometer errores. Verifica la información importante.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const REQUIERE_CLAVE = {{ 'true' if requiere_clave else 'false' }};
const $ = (id) => document.getElementById(id);
const chat = $('chat'), scroll = $('scroll'), texto = $('texto'), btnEnviar = $('enviar'),
      previas = $('previas'), caja = $('caja'), inputArchivo = $('archivo');

let historial = [];      // mensajes que se envían al servidor
let pendientes = [];     // adjuntos aún no enviados
let ocupado = false;

// ---------- Utilidades ----------
function logoHTML() { return '<svg class="avatar"><use href="#logo"/></svg>'; }

function bajar() { scroll.scrollTop = scroll.scrollHeight; }

function renderMarkdown(md) {
  const html = DOMPurify.sanitize(marked.parse(md, { breaks: true }));
  const cont = document.createElement('div');
  cont.innerHTML = html;
  cont.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  cont.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'copiar'; b.textContent = 'Copiar';
    b.onclick = () => {
      navigator.clipboard.writeText(pre.innerText.replace(/Copiar$/, '').trim());
      b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = 'Copiar', 1500);
    };
    pre.appendChild(b);
  });
  return cont;
}

function quitarBienvenida() { const b = $('bienvenida'); if (b) b.remove(); }

function agregarUsuario(textoMsg, adjuntos) {
  quitarBienvenida();
  const div = document.createElement('div');
  div.className = 'msg user';
  const cuerpo = document.createElement('div');
  cuerpo.className = 'cuerpo';
  if (adjuntos.length) {
    const fila = document.createElement('div');
    fila.className = 'adjuntos-msg';
    adjuntos.forEach(a => {
      if (a.tipo === 'imagen') {
        const img = document.createElement('img'); img.src = a.dataUrl; fila.appendChild(img);
      } else {
        const c = document.createElement('div'); c.className = 'chip';
        c.innerHTML = '<span></span>'; c.firstChild.textContent = '📄 ' + a.nombre;
        c.style.paddingRight = '10px'; fila.appendChild(c);
      }
    });
    cuerpo.appendChild(fila);
  }
  if (textoMsg) cuerpo.appendChild(document.createTextNode(textoMsg));
  div.appendChild(cuerpo);
  chat.appendChild(div);
  bajar();
}

function agregarBot(contenido, esError) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = logoHTML();
  const cuerpo = document.createElement('div');
  cuerpo.className = 'cuerpo' + (esError ? ' error' : '');
  if (esError) cuerpo.textContent = contenido; else cuerpo.appendChild(renderMarkdown(contenido));
  div.appendChild(cuerpo);
  chat.appendChild(div);
  bajar();
  return div;
}

function agregarEscribiendo() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = logoHTML() + '<div class="cuerpo"><span class="puntos"><i></i><i></i><i></i></span></div>';
  chat.appendChild(div); bajar();
  return div;
}

// ---------- Llamadas al servidor ----------
async function api(url, opciones = {}) {
  opciones.headers = Object.assign({}, opciones.headers);
  const clave = sessionStorage.getItem('tampy_clave');
  if (clave) opciones.headers['X-Clave'] = clave;
  let r = await fetch(url, opciones);
  if (r.status === 401 && REQUIERE_CLAVE) {
    const nueva = prompt('Clave de acceso de TAMPY:');
    if (!nueva) return r;
    sessionStorage.setItem('tampy_clave', nueva);
    opciones.headers['X-Clave'] = nueva;
    r = await fetch(url, opciones);
  }
  return r;
}

// ---------- Adjuntos ----------
function redimensionarImagen(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      const escala = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('No pude abrir la imagen ' + file.name));
    img.src = url;
  });
}

async function procesarArchivos(lista) {
  for (const file of lista) {
    if (pendientes.length >= 5) { alert('Máximo 5 adjuntos por mensaje.'); break; }
    try {
      if (file.type.startsWith('image/')) {
        const dataUrl = await redimensionarImagen(file);
        pendientes.push({ tipo: 'imagen', nombre: file.name || 'imagen.jpg', dataUrl });
      } else {
        const fd = new FormData(); fd.append('archivo', file);
        const r = await api('/api/archivo', { method: 'POST', body: fd });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Error al leer el archivo');
        pendientes.push({ tipo: 'archivo', nombre: d.nombre, texto: d.texto, truncado: d.truncado });
      }
    } catch (e) { alert(e.message); }
  }
  pintarPrevias();
}

function pintarPrevias() {
  previas.innerHTML = '';
  pendientes.forEach((a, i) => {
    const chip = document.createElement('div'); chip.className = 'chip';
    if (a.tipo === 'imagen') { const im = document.createElement('img'); im.src = a.dataUrl; chip.appendChild(im); }
    const s = document.createElement('span'); s.textContent = (a.tipo === 'archivo' ? '📄 ' : '') + a.nombre; chip.appendChild(s);
    const x = document.createElement('button'); x.textContent = '×'; x.title = 'Quitar';
    x.onclick = () => { pendientes.splice(i, 1); pintarPrevias(); };
    chip.appendChild(x); previas.appendChild(chip);
  });
}

inputArchivo.addEventListener('change', async (e) => { await procesarArchivos([...e.target.files]); inputArchivo.value = ''; });
texto.addEventListener('paste', async (e) => {
  const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (imgs.length) { e.preventDefault(); await procesarArchivos(imgs); }
});
['dragenter', 'dragover'].forEach(ev => caja.addEventListener(ev, e => { e.preventDefault(); caja.classList.add('arrastrando'); }));
['dragleave', 'drop'].forEach(ev => caja.addEventListener(ev, e => { e.preventDefault(); caja.classList.remove('arrastrando'); }));
caja.addEventListener('drop', e => procesarArchivos([...e.dataTransfer.files]));

// ---------- Enviar ----------
async function enviar() {
  if (ocupado) return;
  const mensaje = texto.value.trim();
  if (!mensaje && !pendientes.length) return;

  const adjuntos = pendientes; pendientes = []; pintarPrevias();
  const imagenes = adjuntos.filter(a => a.tipo === 'imagen');
  const archivos = adjuntos.filter(a => a.tipo === 'archivo');

  let cuerpoTexto = '';
  archivos.forEach(a => {
    cuerpoTexto += `[Archivo adjunto: ${a.nombre}]\n${a.texto}\n` +
      (a.truncado ? '[...archivo recortado por longitud]\n' : '') + '[Fin del archivo]\n\n';
  });
  cuerpoTexto += mensaje || (imagenes.length ? 'Describe y analiza esta imagen.' : 'Analiza este archivo.');

  const contenido = imagenes.length
    ? [{ type: 'text', text: cuerpoTexto }, ...imagenes.map(a => ({ type: 'image_url', image_url: { url: a.dataUrl } }))]
    : cuerpoTexto;

  agregarUsuario(mensaje, adjuntos);
  historial.push({ role: 'user', content: contenido });
  texto.value = ''; autoAltura();
  ocupado = true; btnEnviar.disabled = true;
  const escribiendo = agregarEscribiendo();

  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensajes: historial })
    });
    const d = await r.json();
    escribiendo.remove();
    if (!r.ok) throw new Error(d.error || 'Error desconocido');
    historial.push({ role: 'assistant', content: d.respuesta });
    agregarBot(d.respuesta);
  } catch (e) {
    escribiendo.remove();
    historial.pop(); // el mensaje fallido no queda en el historial
    agregarBot('⚠️ ' + e.message, true);
  }
  ocupado = false; btnEnviar.disabled = false; texto.focus();
}

function nuevaConversacion() {
  historial = []; pendientes = []; pintarPrevias();
  location.reload();
}
function sugerir(t) { texto.value = t; autoAltura(); texto.focus(); }
function autoAltura() { texto.style.height = 'auto'; texto.style.height = Math.min(texto.scrollHeight, 200) + 'px'; }

texto.addEventListener('input', autoAltura);
texto.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviar(); }
});
btnEnviar.addEventListener('click', enviar);
</script>
</body>
</html>
